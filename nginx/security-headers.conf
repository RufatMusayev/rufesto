# Shared security headers, `include`d wherever they're needed.
#
# nginx add_header inheritance: once a location defines its OWN add_header, it stops
# inheriting the server-level list entirely (server-level headers are silently dropped
# for that location). So this file is included at server level (for responses that don't
# come from a location of their own, e.g. nginx error pages) AND again inside any location
# that sets its own add_header (the /assets/ and / cache-control rules) so nothing gets lost.
#
# CSP is Report-Only for now. To enforce: delete the Report-Only line below and uncomment
# the enforced line right under it (same string, header name Content-Security-Policy), after
# a clean run against both preview and prod with no violations in the browser console.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# camera: the consumer app scans QR codes via getUserMedia. geolocation: map/"near me".
add_header Permissions-Policy "camera=(self), geolocation=(self)" always;
# TLS terminates at Cloudflare, not this container, but HSTS is still a valid response
# header to send from the origin — Cloudflare passes it through to the browser.
# No includeSubDomains: rufat-server.com also hosts other products (poker, quickfix…).
add_header Strict-Transport-Security "max-age=31536000" always;
# Origins the SPAs need (from the built bundles + index.html; ONE image serves both stacks,
# so both Supabase project refs are listed: prod bjohnoaezfmrgunvjixt, preview qqwvtuckljwvwrvyrjbn.
# Add a ref here if a third project is ever used):
#   connect-src  Supabase REST/Auth/Storage (https) + Realtime (wss)
#   img-src      Supabase Storage photos, OSM map tiles (Leaflet), Google avatars (OAuth), data:/blob: (Leaflet icons, QR)
#   style-src    Google Fonts CSS; 'unsafe-inline' for React style="" attributes
#   font-src     Google Fonts files
#   media-src    blob: for the camera QR scanner (html5-qrcode)
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://bjohnoaezfmrgunvjixt.supabase.co https://qqwvtuckljwvwrvyrjbn.supabase.co https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://lh3.googleusercontent.com; connect-src 'self' https://cloudflareinsights.com https://bjohnoaezfmrgunvjixt.supabase.co wss://bjohnoaezfmrgunvjixt.supabase.co https://qqwvtuckljwvwrvyrjbn.supabase.co wss://qqwvtuckljwvwrvyrjbn.supabase.co; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# ENFORCED version, ready to switch: delete the Report-Only line above and uncomment this one.
