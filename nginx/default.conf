# One image, both environments. Stack isolation is by host port + Cloudflare Tunnel
# routing (rufesto.* -> r_rufesto:8090, rufat-server.* -> p_rufesto:8080), NOT by which
# hostnames nginx knows. Knowing all four hostnames means the SAME image runs in either
# stack; nginx only decides consumer-vs-resto within whichever stack receives the request.

# This file is included inside the http{} block (nginx:alpine's nginx.conf does
# `include /etc/nginx/conf.d/*.conf;`), so http-context directives are valid here.
server_tokens off;

# ---- Consumer SPA: prod (rufesto.com) + preview (rufat-server.com) ----
server {
    listen 80 default_server;
    server_name rufesto.com www.rufesto.com rufat-server.com www.rufat-server.com;

    root /usr/share/nginx/html/client;
    index index.html;

    # Applies to any response that doesn't come from a location setting its own add_header
    # (e.g. nginx-generated error pages). Locations that add Cache-Control re-include this
    # file (see the inheritance note in security-headers.conf).
    include /etc/nginx/snippets/security-headers.conf;

    # Vite hashed build output (client/dist/assets/*) — safe to cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html / SPA fallback must always be revalidated, or a stale shell keeps
    # pointing at assets from a previous, no-longer-served build.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}

# ---- Resto dashboard SPA: prod (resto.rufesto.com) + preview (resto.rufat-server.com) ----
server {
    listen 80;
    server_name resto.rufesto.com resto.rufat-server.com;

    root /usr/share/nginx/html/resto;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
