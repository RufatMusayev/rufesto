# Shared security headers, `include`d wherever they're needed.
#
# nginx add_header inheritance: once a location defines its OWN add_header, it stops
# inheriting the server-level list entirely (server-level headers are silently dropped
# for that location). So this file is included at server level (for locations that add
# nothing of their own, e.g. /api/) AND again inside any location that sets its own
# add_header (e.g. the /assets/ and / cache-control rules) so nothing gets lost there.
#
# CSP is Report-Only for now — enforce (rename to Content-Security-Policy) after a
# clean run against both preview and prod.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# camera: the consumer app scans QR codes via getUserMedia. geolocation: map/"near me".
add_header Permissions-Policy "camera=(self), geolocation=(self)" always;
# TLS terminates at Cloudflare, not this container, but HSTS is still a valid response
# header to send from the origin — Cloudflare passes it through to the browser.
# No includeSubDomains: rufat-server.com also hosts other products (poker, quickfix…).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob: https://*.supabase.co https://*.tile.openstreetmap.org https://lh3.googleusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; frame-ancestors 'none'" always;
