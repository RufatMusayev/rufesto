# Project name comes from the deploy command, NOT this file:
#   real    site (rufesto.com)      -> docker compose -p r_rufesto --env-file .env.prod    up -d --build
#   preview site (rufat-server.com) -> docker compose -p p_rufesto --env-file .env.preview up -d --build
# Each stack binds its own host port (WEB_PORT) so the two never collide on :80.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    ports:
      # cloudflared runs on the host (not in this compose network) and reaches this
      # container over localhost, so bind loopback-only — nothing needs to reach
      # WEB_PORT from the LAN or a public IP directly.
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    restart: unless-stopped
