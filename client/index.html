<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8B2D42" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rufesto" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- PWA: installable on a phone (iOS only delivers web push to the installed app); icons are generated from favicon.svg -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Rufesto — Real-Time Restaurant Discovery</title>
    <meta name="description" content="Discover where Baku eats tonight. Real-time menus, dish-level reviews, and instant table booking." />
    <!-- preconnect to the Supabase origin and images.unsplash.com is added at build time (vite.config.js) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- not render-blocking: media="print" until /boot.js switches it to "all" once loaded (display=swap) -->
    <link id="gf-css" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&family=Barlow+Condensed:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&family=Barlow+Condensed:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <!-- the first paint before any JS: the phone header bar, same height and wordmark as the real one (React replaces it) -->
    <style>
      .boot { display: none; }
      @media (max-width: 768px) {
        .boot { display: block; }
        .boot-bar { display: flex; align-items: center; height: var(--nav-h, 56px); padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--bg); }
        .boot-logo { font-family: 'Playfair Display', Georgia, serif; font-size: 1.4rem; font-weight: 700; font-style: italic; letter-spacing: -0.5px; color: var(--t1); }
      }
    </style>
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="root"><div class="boot" aria-hidden="true"><div class="boot-bar"><span class="boot-logo">Rufesto</span></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
